<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dick's House Defence</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family: 'Segoe UI', system-ui, sans-serif; }
  #gameContainer { position:relative; width:100vw; height:100vh; overflow:hidden; }

  canvas { position:absolute; top:0; left:0; display:block; }

  .screen { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background-size:cover; background-position:center; }
  .hidden { display:none !important; }

  #homeScreen { background-image:url('assets/homescreen.jpg'); }
  #homeOverlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.25); }

  .title {
    position:relative;
    color:#fff;
    font-size:clamp(28px, 8vw, 56px);
    font-weight:900;
    letter-spacing:1px;
    text-align:center;
    text-shadow: 3px 3px 0 #ff1e1e, -1px -1px 0 #000;
    margin-bottom:40px;
    animation: shake 3.5s infinite;
    padding:0 20px;
  }
  @keyframes shake {
    0%,92%,100% { transform: translate(0,0) rotate(0deg); }
    93% { transform: translate(-2px,1px) rotate(-1deg); }
    94% { transform: translate(2px,-1px) rotate(1deg); }
    95% { transform: translate(-1px,2px) rotate(0deg); }
    96% { transform: translate(1px,-2px) rotate(1deg); }
    97% { transform: translate(0,0) rotate(0deg); }
  }

  .menuBtn { position:relative; cursor:pointer; border:none; background:none; padding:0; margin:10px 0; display:block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); transition: transform 0.1s; }
  .menuBtn img { width: min(60vw, 320px); display:block; }
  .menuBtn:active { transform: scale(0.94); }

  #settingsPanel {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.85); display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:20;
  }
  #settingsPanel h2 { color:#fff; font-size:28px; margin-bottom:30px; letter-spacing:2px; }
  .settingRow { display:flex; align-items:center; gap:16px; margin:14px 0; }
  .settingLabel { color:#fff; font-size:18px; min-width:140px; }
  .toggleBtn {
    padding:10px 22px; border-radius:20px; border:2px solid #fff; background:#c40000; color:#fff;
    font-weight:700; font-size:15px; cursor:pointer;
  }
  .toggleBtn.off { background:#333; }
  .terrorBtn {
    margin-top:18px; padding:12px 20px; border-radius:10px; border:2px dashed #ff4444;
    background:#1a0000; color:#ff8888; font-size:14px; cursor:pointer; max-width:260px; text-align:center;
  }
  .closeSettings {
    margin-top:30px; padding:10px 30px; border-radius:20px; border:none; background:#444; color:#fff; font-size:16px; cursor:pointer;
  }
  #complaintPopup {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#fff; color:#000; padding:20px 30px; border-radius:10px; font-weight:700;
    box-shadow:0 0 30px rgba(255,0,0,0.6); z-index:30; text-align:center;
  }

  #gameScreen { display:none; }
  #gameScreen.active { display:block; }

  #hud { position:absolute; top:0; left:0; width:100%; padding:12px 16px; display:flex; justify-content:space-between; align-items:flex-start; z-index:5; pointer-events:none; }
  #hpWrap { background:rgba(0,0,0,0.5); border-radius:8px; padding:6px 10px; }
  #hpLabel { color:#fff; font-size:12px; letter-spacing:1px; margin-bottom:3px; }
  #hpBarBg { width:140px; height:14px; background:#3a0000; border-radius:7px; overflow:hidden; border:1px solid #fff; }
  #hpBarFill { height:100%; background:linear-gradient(90deg,#ff2b2b,#ff6a00); width:100%; transition: width 0.15s; }
  #scoreWrap { background:rgba(0,0,0,0.5); border-radius:8px; padding:6px 12px; color:#fff; font-size:14px; font-weight:700; }

  #joystickBase {
    position:absolute; width:110px; height:110px; border-radius:50%;
    background:rgba(255,255,255,0.12); border:3px solid rgba(255,255,255,0.4);
    z-index:6;
  }
  #joystickKnob {
    position:absolute; width:50px; height:50px; border-radius:50%;
    background:rgba(255,30,30,0.7); border:2px solid #fff;
    left:30px; top:30px;
  }
  #throwBtn {
    position:absolute; width:90px; height:90px; border-radius:50%;
    background:rgba(255,30,30,0.55); border:3px solid #fff; color:#fff;
    font-weight:900; font-size:14px; display:flex; align-items:center; justify-content:center;
    z-index:6; letter-spacing:1px; text-align:center;
  }
  #throwBtn:active { background:rgba(255,30,30,0.85); }

  #gameOverScreen {
    position:absolute; top:0; left:0; width:100%; height:100%; z-index:25;
    background:rgba(0,0,0,0.88); display:none; flex-direction:column; align-items:center; justify-content:center;
  }
  #gameOverScreen.active { display:flex; }
  #gameOverScreen h1 { color:#ff2b2b; font-size:clamp(30px,8vw,54px); margin-bottom:6px; letter-spacing:2px; }
  #finalScore { color:#fff; font-size:20px; margin-bottom:26px; }

  #areaFlash {
    position:absolute; top:14%; left:50%; transform:translate(-50%,-50%);
    color:#fff; font-size:15px; letter-spacing:3px; opacity:0; z-index:7;
    text-shadow:2px 2px 4px #000; pointer-events:none; transition:opacity 0.4s;
  }
</style>
</head>
<body>

<div id="gameContainer">

  <!-- HOME SCREEN -->
  <div id="homeScreen" class="screen">
    <div id="homeOverlay"></div>
    <div style="position:relative; display:flex; flex-direction:column; align-items:center; z-index:2;">
      <div class="title">DICK'S HOUSE<br>DEFENCE</div>
      <button class="menuBtn" id="playBtn"><img src="assets/btn_play.png" alt="Play"></button>
      <button class="menuBtn" id="settingBtn"><img src="assets/btn_setting.png" alt="Settings"></button>
    </div>
  </div>

  <!-- SETTINGS PANEL -->
  <div id="settingsPanel" class="hidden">
    <h2>SETTINGS</h2>
    <div class="settingRow">
      <span class="settingLabel">SOUND</span>
      <button class="toggleBtn" id="soundToggle">ON</button>
    </div>
    <button class="terrorBtn" id="terrorBtn">🚩 Flag this game for terrorism</button>
    <button class="closeSettings" id="closeSettingsBtn">Close</button>
  </div>
  <div id="complaintPopup" class="hidden">Complaint sent.<br><span style="font-weight:400;font-size:12px;">(nothing happened)</span></div>

  <!-- GAME SCREEN -->
  <div id="gameScreen">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div id="hpWrap">
        <div id="hpLabel">HP</div>
        <div id="hpBarBg"><div id="hpBarFill"></div></div>
      </div>
      <div id="scoreWrap">KILLS: <span id="scoreVal">0</span></div>
    </div>

    <div id="areaFlash"></div>

    <div id="joystickBase"><div id="joystickKnob"></div></div>
    <div id="throwBtn">THROW</div>
  </div>

  <!-- GAME OVER -->
  <div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <div id="finalScore">Kills: 0</div>
    <button class="menuBtn" id="replayBtn"><img src="assets/btn_replay.png" alt="Replay"></button>
    <button class="menuBtn" id="settingBtn2" style="margin-top:20px;"><img src="assets/btn_setting.png" alt="Settings"></button>
  </div>

</div>

<!-- Audio hooks — placeholder <audio> tags. Drop real files into assets/ with these exact
     names later and they'll just start working; no code changes needed. -->
<audio id="sndIntro" loop preload="none"><source src="assets/intro.mp3" type="audio/mpeg"></audio>
<audio id="sndThrow" preload="none"><source src="assets/throw.mp3" type="audio/mpeg"></audio>
<audio id="sndEnemyDeath" preload="none"><source src="assets/enemy_death.mp3" type="audio/mpeg"></audio>
<audio id="sndHeroHit" preload="none"><source src="assets/hero_hit.mp3" type="audio/mpeg"></audio>
<audio id="sndHeroDeath" preload="none"><source src="assets/hero_death.mp3" type="audio/mpeg"></audio>

<script>
(function(){
"use strict";

/* ============================== CONFIG ============================== */
const WORLD_SIZE = 1600;
const HERO_SIZE = 30;
const HERO_SPEED = 150;            // px/sec
const BRICK_SIZE = 26;
const BRICK_SPEED = HERO_SPEED * 2;
const BRICK_SPIN_DEG_PER_SEC = 900;
const BRICK_MAX_DIST = 700;
const ENEMY_SIZE = 32;
const ENEMY_SPEED = 65;
const ENEMY_TOUCH_DAMAGE = 1;
const ENEMY_TOUCH_COOLDOWN = 1000; // ms
const RAT_SIZE = 20;
const RAT_MIST_RADIUS = 96;        // ~3 blocks (32px block)
const RAT_BODY_RADIUS = 16;
const RAT_MIST_ENTER_DAMAGE = 3;
const RAT_MIST_DPS = 2;
const HERO_MAX_HP = 10;
const AREA_SPAWN_TICK_MS = 10000;  // every 10 seconds
const HURT_FLASH_MS = 220;

/* Areas — approximate rectangular zoning of the 1600x1600 floor map,
   derived from the original photo-collage layout. id 7 spans two rects. */
const AREAS = [
  {id:1, x:0,    y:650,  w:975, h:950},
  {id:2, x:0,    y:345,  w:975, h:305},
  {id:3, x:0,    y:0,    w:975, h:345},
  {id:8, x:975,  y:0,    w:625, h:880},
  {id:6, x:975,  y:880,  w:165, h:100},
  {id:5, x:975,  y:980,  w:165, h:90},
  {id:4, x:975,  y:1070, w:165, h:90},
  {id:7, x:1140, y:880,  w:460, h:720},
  {id:7, x:975,  y:1160, w:165, h:440},
];

const SPAWN_POINT = {x:245.7, y:1202.2};

/* Rat hazard positions — extracted from the user's blue-dot reference map,
   scaled into 1600x1600 world space. */
const RAT_POSITIONS = [
[1491.6,65.3],[1060.5,78.8],[842.5,97.3],[485.3,104.7],[114.5,120.7],[1267.4,144.1],
[1513.8,183.5],[1006.3,184.8],[1390.6,271.0],[1157.8,277.1],[824.0,288.2],[1511.3,369.5],
[578.9,376.9],[114.5,396.6],[1255.1,415.1],[870.8,490.2],[1058.0,516.1],[1471.9,530.9],
[257.4,585.1],[1044.5,703.3],[833.9,704.5],[98.5,732.9],[401.5,735.3],[853.6,932.4],
[139.2,955.8],[1034.6,963.2],[695.9,990.3],[416.3,998.9],[1180.0,1043.3],[458.2,1146.7],
[1172.6,1156.6],[716.9,1205.9],[96.1,1214.5],[1002.6,1215.7],[484.1,1325.3],[842.5,1368.4],
[70.2,1455.9],[1008.8,1510.1],[328.9,1516.2],[727.9,1528.6],[1036.3,386.4]
];

const ENEMY_IMG_NAMES = ['enemy1.png','enemy2.png','enemy3.png','enemy4.png'];

/* ============================== STATE ============================== */
let canvas, ctx;
let dpr = window.devicePixelRatio || 1;
let soundOn = true;
let gameState = 'home'; // home | playing | gameover
let lastTime = 0;

let hero = null;
let bricks = [];
let enemies = [];
let rats = [];
let areaStates = {}; // id -> {count, visitStart, lastTick}
let score = 0;
let camera = {x:0, y:0};
let currentAreaFlashShown = {};

let images = {};

/* Joystick / throw input */
let joyActive = false;
let joyVec = {x:0, y:0};
let joyPointerId = null;
let throwHeld = false;
let throwInterval = null;

/* Keyboard fallback */
let keys = {};

/* ============================== ASSET LOADING ============================== */
function loadImage(name){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=> resolve(img);
    img.onerror = ()=> resolve(null);
    img.src = 'assets/' + name;
  });
}

async function loadAllImages(){
  const names = ['floor.jpg','hero.png','rat.png','brick.png',
    'enemy1.png','enemy2.png','enemy3.png','enemy4.png'];
  for (const n of names){
    images[n] = await loadImage(n);
  }
}

/* ============================== UTIL ============================== */
function now(){ return performance.now(); }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx, ay-by); }
function clamp(v,min,max){ return Math.max(min, Math.min(max,v)); }
function getAreaId(x,y){
  for (const r of AREAS){
    if (x>=r.x && x<r.x+r.w && y>=r.y && y<r.y+r.h) return r.id;
  }
  return 1;
}
function areaRects(id){ return AREAS.filter(r=>r.id===id); }
function randRange(a,b){ return a + Math.random()*(b-a); }

function playSound(id){
  if (!soundOn) return;
  const el = document.getElementById(id);
  if (!el) return;
  try {
    el.currentTime = 0;
    el.play().catch(()=>{});
  } catch(e){}
}

/* ============================== INIT GAME ============================== */
function resetGame(){
  hero = {
    x: SPAWN_POINT.x, y: SPAWN_POINT.y,
    hp: HERO_MAX_HP,
    facing: {x:0, y:-1},
    lastArea: null,
    currentMistRat: null,
    hurtUntil: 0,
    moving:false
  };
  bricks = [];
  enemies = [];
  score = 0;
  areaStates = {};
  currentAreaFlashShown = {};

  rats = RAT_POSITIONS.map(([x,y])=>({
    x, y,
    angle: Math.random()*360,
    spin: randRange(40,90) * (Math.random()<0.5?-1:1)
  }));

  updateHUD();
}

/* ============================== ENEMY SPAWNING ============================== */
function spawnEnemyInArea(areaId){
  const rects = areaRects(areaId);
  const r = rects[Math.floor(Math.random()*rects.length)];
  const x = randRange(r.x+20, r.x+r.w-20);
  const y = randRange(r.y+20, r.y+r.h-20);
  const imgName = ENEMY_IMG_NAMES[Math.floor(Math.random()*ENEMY_IMG_NAMES.length)];
  enemies.push({
    x, y, img:imgName,
    lastHitHeroAt: 0,
    hurtUntil: 0,
    dying:false, dieUntil:0
  });
}

function updateAreaSpawns(){
  const areaId = getAreaId(hero.x, hero.y);
  if (hero.lastArea !== areaId){
    hero.lastArea = areaId;
    if (!areaStates[areaId]){
      areaStates[areaId] = {count:0, visitStart:now(), lastTick:now()};
    } else {
      areaStates[areaId].visitStart = now();
      areaStates[areaId].lastTick = now();
    }
  }
  const st = areaStates[areaId];
  if (!st) return;
  const t = now();
  if (t - st.lastTick >= AREA_SPAWN_TICK_MS){
    st.lastTick = t;
    const minute = Math.floor((t - st.visitStart) / 60000) + 1;
    for (let i=0;i<minute;i++){
      spawnEnemyInArea(areaId);
      st.count++;
    }
  }
}

/* ============================== INPUT ============================== */
function setupInput(){
  const joyBase = document.getElementById('joystickBase');
  const joyKnob = document.getElementById('joystickKnob');
  const throwBtn = document.getElementById('throwBtn');

  function layoutControls(){
    const w = window.innerWidth, h = window.innerHeight;
    const baseSize = 110;
    joyBase.style.left = '24px';
    joyBase.style.top = (h - baseSize - 30) + 'px';
    throwBtn.style.right = '24px';
    throwBtn.style.left = 'auto';
    throwBtn.style.top = (h - 90 - 40) + 'px';
  }
  window.addEventListener('resize', layoutControls);
  layoutControls();

  function joyRect(){ return joyBase.getBoundingClientRect(); }

  function handleJoyMove(clientX, clientY){
    const rect = joyRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const maxR = rect.width/2;
    const d = Math.hypot(dx,dy);
    if (d > maxR){ dx = dx/d*maxR; dy = dy/d*maxR; }
    joyKnob.style.left = (30 + dx) + 'px';
    joyKnob.style.top = (30 + dy) + 'px';
    const nd = Math.hypot(dx,dy) / maxR;
    if (nd > 0.15){
      joyVec.x = dx / maxR;
      joyVec.y = dy / maxR;
    } else {
      joyVec.x = 0; joyVec.y = 0;
    }
  }
  function resetJoy(){
    joyActive = false; joyPointerId = null;
    joyVec.x = 0; joyVec.y = 0;
    joyKnob.style.left = '30px'; joyKnob.style.top = '30px';
  }

  joyBase.addEventListener('pointerdown', (e)=>{
    joyActive = true; joyPointerId = e.pointerId;
    joyBase.setPointerCapture(e.pointerId);
    handleJoyMove(e.clientX, e.clientY);
  });
  joyBase.addEventListener('pointermove', (e)=>{
    if (joyActive && e.pointerId === joyPointerId) handleJoyMove(e.clientX, e.clientY);
  });
  joyBase.addEventListener('pointerup', resetJoy);
  joyBase.addEventListener('pointercancel', resetJoy);

  function doThrow(){
    if (gameState !== 'playing') return;
    throwBrick();
  }
  throwBtn.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    throwHeld = true;
    doThrow();
    throwInterval = setInterval(doThrow, 130);
  });
  function stopThrow(){
    throwHeld = false;
    if (throwInterval){ clearInterval(throwInterval); throwInterval = null; }
  }
  throwBtn.addEventListener('pointerup', stopThrow);
  throwBtn.addEventListener('pointerleave', stopThrow);
  throwBtn.addEventListener('pointercancel', stopThrow);

  // Desktop keyboard fallback
  window.addEventListener('keydown', (e)=>{
    keys[e.key.toLowerCase()] = true;
    if (e.code === 'Space'){ e.preventDefault(); doThrow(); }
  });
  window.addEventListener('keyup', (e)=>{ keys[e.key.toLowerCase()] = false; });
  window.addEventListener('click', ()=>{
    if (gameState === 'playing') doThrow();
  });
}

function getMoveVector(){
  let dx = joyVec.x, dy = joyVec.y;
  if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01){
    let kx=0, ky=0;
    if (keys['w'] || keys['arrowup']) ky -= 1;
    if (keys['s'] || keys['arrowdown']) ky += 1;
    if (keys['a'] || keys['arrowleft']) kx -= 1;
    if (keys['d'] || keys['arrowright']) kx += 1;
    const d = Math.hypot(kx,ky);
    if (d>0){ dx = kx/d; dy = ky/d; }
  }
  return {x:dx, y:dy};
}

/* ============================== BRICKS ============================== */
function throwBrick(){
  playSound('sndThrow');
  bricks.push({
    x: hero.x, y: hero.y,
    dx: hero.facing.x, dy: hero.facing.y,
    traveled: 0,
    rot: 0
  });
}

/* ============================== UPDATE ============================== */
function update(dt){
  if (gameState !== 'playing') return;

  const mv = getMoveVector();
  hero.moving = (Math.abs(mv.x)>0.01 || Math.abs(mv.y)>0.01);
  if (hero.moving){
    hero.x += mv.x * HERO_SPEED * dt;
    hero.y += mv.y * HERO_SPEED * dt;
    const len = Math.hypot(mv.x,mv.y);
    hero.facing.x = mv.x/len;
    hero.facing.y = mv.y/len;
  }
  hero.x = clamp(hero.x, HERO_SIZE/2, WORLD_SIZE - HERO_SIZE/2);
  hero.y = clamp(hero.y, HERO_SIZE/2, WORLD_SIZE - HERO_SIZE/2);

  updateAreaSpawns();
  showAreaFlashIfNeeded();

  // rats
  let insideMistRat = null;
  for (const rat of rats){
    rat.angle += rat.spin * dt;
    const d = dist(hero.x,hero.y, rat.x,rat.y);
    if (d < RAT_BODY_RADIUS + HERO_SIZE/2){
      // physical push — shove hero to just outside body radius
      const ang = Math.atan2(hero.y-rat.y, hero.x-rat.x) || Math.random()*Math.PI*2;
      const pushR = RAT_BODY_RADIUS + HERO_SIZE/2 + 1;
      hero.x = rat.x + Math.cos(ang)*pushR;
      hero.y = rat.y + Math.sin(ang)*pushR;
    } else if (d < RAT_MIST_RADIUS){
      insideMistRat = rat;
    }
  }
  if (insideMistRat){
    if (hero.currentMistRat !== insideMistRat){
      hero.currentMistRat = insideMistRat;
      damageHero(RAT_MIST_ENTER_DAMAGE);
    } else {
      damageHero(RAT_MIST_DPS * dt);
    }
  } else {
    hero.currentMistRat = null;
  }

  // bricks
  for (let i=bricks.length-1; i>=0; i--){
    const b = bricks[i];
    b.x += b.dx * BRICK_SPEED * dt;
    b.y += b.dy * BRICK_SPEED * dt;
    b.rot += BRICK_SPIN_DEG_PER_SEC * dt;
    b.traveled += BRICK_SPEED * dt;
    let hit = false;
    for (const en of enemies){
      if (en.dying) continue;
      if (dist(b.x,b.y, en.x,en.y) < (BRICK_SIZE/2 + ENEMY_SIZE/2)){
        killEnemy(en);
        hit = true;
        break;
      }
    }
    if (hit || b.traveled > BRICK_MAX_DIST || b.x<0||b.x>WORLD_SIZE||b.y<0||b.y>WORLD_SIZE){
      bricks.splice(i,1);
    }
  }

  // enemies
  const t = now();
  for (let i=enemies.length-1; i>=0; i--){
    const en = enemies[i];
    if (en.dying){
      if (t > en.dieUntil) enemies.splice(i,1);
      continue;
    }
    const d = dist(en.x,en.y, hero.x,hero.y);
    if (d > 1){
      en.x += (hero.x-en.x)/d * ENEMY_SPEED * dt;
      en.y += (hero.y-en.y)/d * ENEMY_SPEED * dt;
    }
    if (d < (ENEMY_SIZE/2 + HERO_SIZE/2) && t - en.lastHitHeroAt > ENEMY_TOUCH_COOLDOWN){
      en.lastHitHeroAt = t;
      damageHero(ENEMY_TOUCH_DAMAGE);
    }
  }

  // camera follows hero, clamped to world bounds
  camera.x = clamp(hero.x - canvas.width/(2*dpr), 0, WORLD_SIZE - canvas.width/dpr);
  camera.y = clamp(hero.y - canvas.height/(2*dpr), 0, WORLD_SIZE - canvas.height/dpr);

  updateHUD();
}

function damageHero(amount){
  if (gameState !== 'playing') return;
  hero.hp -= amount;
  hero.hurtUntil = now() + HURT_FLASH_MS;
  playSound('sndHeroHit');
  if (hero.hp <= 0){
    hero.hp = 0;
    endGame();
  }
}

function killEnemy(en){
  en.dying = true;
  en.dieUntil = now() + 180;
  en.hurtUntil = now() + 180;
  score++;
  playSound('sndEnemyDeath');
}

function endGame(){
  gameState = 'gameover';
  playSound('sndHeroDeath');
  document.getElementById('finalScore').textContent = 'Kills: ' + score;
  document.getElementById('gameOverScreen').classList.add('active');
}

/* ============================== HUD ============================== */
function updateHUD(){
  const pct = Math.max(0, hero.hp / HERO_MAX_HP * 100);
  document.getElementById('hpBarFill').style.width = pct + '%';
  document.getElementById('scoreVal').textContent = score;
}

const AREA_LABELS_ORDER = null; // no title cards per design — kept minimal
function showAreaFlashIfNeeded(){
  // Intentionally minimal: no area-name popups (dropped from scope).
}

/* ============================== RENDER ============================== */
function drawEntityWithHurtFlash(img, x, y, size, rotationDeg, hurtUntil){
  const t = now();
  const isHurt = t < hurtUntil;
  let scale = 1;
  if (isHurt){
    const remain = (hurtUntil - t) / HURT_FLASH_MS;
    scale = 1 + 0.35 * remain;
  }
  ctx.save();
  ctx.translate(x - camera.x, y - camera.y);
  if (rotationDeg) ctx.rotate(rotationDeg * Math.PI/180);
  ctx.scale(scale, scale);
  if (img){
    ctx.drawImage(img, -size/2, -size/2, size, size);
    if (isHurt){
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = 'rgba(255,0,0,0.55)';
      ctx.fillRect(-size/2, -size/2, size, size);
      ctx.globalCompositeOperation = 'source-over';
    }
  } else {
    ctx.fillStyle = isHurt ? '#ff3333' : '#888';
    ctx.beginPath();
    ctx.arc(0,0,size/2,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function render(){
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  if (gameState !== 'playing'){ return; }

  // floor background
  if (images['floor.jpg']){
    ctx.drawImage(images['floor.jpg'], -camera.x, -camera.y, WORLD_SIZE, WORLD_SIZE);
  } else {
    ctx.fillStyle = '#222';
    ctx.fillRect(0,0,w,h);
  }

  // rats + mist
  for (const rat of rats){
    const sx = rat.x - camera.x, sy = rat.y - camera.y;
    if (sx < -150 || sx > w+150 || sy < -150 || sy > h+150) continue;
    const pulse = 1 + 0.06*Math.sin(now()/300 + rat.x);
    const grad = ctx.createRadialGradient(sx,sy,4, sx,sy, RAT_MIST_RADIUS*pulse);
    grad.addColorStop(0, 'rgba(140,255,150,0.35)');
    grad.addColorStop(0.6, 'rgba(120,255,180,0.16)');
    grad.addColorStop(1, 'rgba(120,255,180,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(sx,sy, RAT_MIST_RADIUS*pulse, 0, Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.translate(sx,sy);
    ctx.rotate(rat.angle * Math.PI/180);
    if (images['rat.png']){
      ctx.drawImage(images['rat.png'], -RAT_SIZE, -RAT_SIZE/2, RAT_SIZE*2, RAT_SIZE);
    } else {
      ctx.fillStyle = '#553322';
      ctx.beginPath(); ctx.arc(0,0,RAT_SIZE/2,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // enemies
  for (const en of enemies){
    const sx = en.x - camera.x, sy = en.y - camera.y;
    if (sx < -80 || sx > w+80 || sy < -80 || sy > h+80) continue;
    let size = ENEMY_SIZE;
    if (en.dying){
      const remain = Math.max(0, en.dieUntil - now())/180;
      size = ENEMY_SIZE * (1 + 0.8*(1-remain));
      ctx.save();
      ctx.globalAlpha = remain;
      drawEntityWithHurtFlash(images[en.img], en.x, en.y, size, 0, en.hurtUntil);
      ctx.restore();
    } else {
      drawEntityWithHurtFlash(images[en.img], en.x, en.y, size, 0, en.hurtUntil);
    }
  }

  // bricks
  for (const b of bricks){
    const sx = b.x - camera.x, sy = b.y - camera.y;
    ctx.save();
    ctx.translate(sx,sy);
    ctx.rotate(b.rot * Math.PI/180);
    if (images['brick.png']){
      ctx.drawImage(images['brick.png'], -BRICK_SIZE/2, -BRICK_SIZE/2, BRICK_SIZE, BRICK_SIZE);
    } else {
      ctx.fillStyle = '#b5541e';
      ctx.fillRect(-BRICK_SIZE/2,-BRICK_SIZE/2,BRICK_SIZE,BRICK_SIZE);
    }
    ctx.restore();
  }

  // hero
  const heroAngle = Math.atan2(hero.facing.y, hero.facing.x) * 180/Math.PI + 90;
  const bob = hero.moving ? Math.sin(now()/90)*2 : Math.sin(now()/500)*1.5;
  ctx.save();
  ctx.translate(0, bob);
  drawEntityWithHurtFlash(images['hero.png'], hero.x, hero.y, HERO_SIZE, heroAngle, hero.hurtUntil);
  ctx.restore();
}

/* ============================== MAIN LOOP ============================== */
function loop(t){
  if (!lastTime) lastTime = t;
  const dt = Math.min(0.05, (t - lastTime)/1000);
  lastTime = t;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ============================== CANVAS SIZING ============================== */
function resizeCanvas(){
  dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
}

/* ============================== UI WIRING ============================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  if (id) document.getElementById(id).classList.remove('hidden');
}

function startGame(){
  resetGame();
  gameState = 'playing';
  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  const intro = document.getElementById('sndIntro');
  intro.pause();
}

function backToHome(){
  gameState = 'home';
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('gameOverScreen').classList.remove('active');
  document.getElementById('homeScreen').classList.remove('hidden');
  if (soundOn){
    const intro = document.getElementById('sndIntro');
    intro.play().catch(()=>{});
  }
}

function wireUI(){
  document.getElementById('playBtn').addEventListener('click', ()=>{
    if (soundOn){
      const intro = document.getElementById('sndIntro');
      intro.pause();
    }
    startGame();
  });
  document.getElementById('replayBtn').addEventListener('click', startGame);

  function openSettings(){ document.getElementById('settingsPanel').classList.remove('hidden'); }
  function closeSettings(){ document.getElementById('settingsPanel').classList.add('hidden'); }
  document.getElementById('settingBtn').addEventListener('click', openSettings);
  document.getElementById('settingBtn2').addEventListener('click', openSettings);
  document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);

  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? 'ON' : 'OFF';
    soundToggle.classList.toggle('off', !soundOn);
    const intro = document.getElementById('sndIntro');
    if (!soundOn) intro.pause();
    else if (gameState==='home') intro.play().catch(()=>{});
  });

  document.getElementById('terrorBtn').addEventListener('click', ()=>{
    const popup = document.getElementById('complaintPopup');
    popup.classList.remove('hidden');
    setTimeout(()=> popup.classList.add('hidden'), 1800);
  });

  window.addEventListener('resize', resizeCanvas);
}

/* ============================== BOOT ============================== */
async function boot(){
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  setupInput();
  wireUI();
  await loadAllImages();
  requestAnimationFrame(loop);

  // try to start intro music on first user interaction (autoplay policy)
  document.body.addEventListener('pointerdown', function once(){
    if (soundOn && gameState==='home'){
      document.getElementById('sndIntro').play().catch(()=>{});
    }
    document.body.removeEventListener('pointerdown', once);
  });
}

boot();

})();
